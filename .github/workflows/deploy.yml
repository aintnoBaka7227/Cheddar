name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy, for example v1.2.3
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git rev-parse -q --verify "refs/tags/$TAG" > /dev/null || { echo "::error::Tag $TAG does not exist"; exit 1; }
          gh release view "$TAG" > /dev/null || { echo "::error::Tag $TAG has no GitHub Release"; exit 1; }
          sha=$(git rev-parse "$TAG^{commit}")
          git fetch origin main
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$TAG ($sha) is not on main"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Trigger the Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          echo "::add-mask::$HOOK"
          curl -fsS -X POST "$HOOK&ref=$SHA" > /dev/null
      - name: Wait for the new commit to serve
        env:
          URL: ${{ vars.PRODUCTION_URL }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          for i in $(seq 60); do
            live=$(curl -fsS "$URL/healthz" 2>/dev/null | jq -r '.commit // empty' || true)
            [ "$live" = "$SHA" ] && exit 0
            echo "Serving ${live:-nothing yet}, waiting for $SHA"
            sleep 15
          done
          echo "::error::$URL did not report commit $SHA within 15 minutes"
          exit 1
      - name: Smoke test
        env:
          URL: ${{ vars.PRODUCTION_URL }}
        run: |
          curl -fsS "$URL/api/counts/global" | jq -e '.count | type == "number"'
          curl -fsS -o /dev/null "$URL/"
