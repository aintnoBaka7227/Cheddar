name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - name: Start the app against Redis
        env:
          Counting__Redis: localhost:6379
          ASPNETCORE_URLS: http://localhost:5080
          ASPNETCORE_ENVIRONMENT: Development
        run: nohup dotnet run --project src/Cheddar.Host -c Release --no-build --no-launch-profile > app.log 2>&1 &
      - name: Wait for /healthz
        run: |
          for i in $(seq 60); do
            curl -fsS http://localhost:5080/healthz && exit 0
            sleep 1
          done
          cat app.log
          exit 1
      - name: Drive the page in headless Chrome
        run: CHROME=$(command -v google-chrome) node .claude/skills/verify/scripts/drive.mjs --url http://localhost:5080/ --out .verify-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-evidence
          path: .verify-evidence
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .
